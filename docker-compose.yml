services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: langkahpublishing-landing:latest
    container_name: langkahpublishing_frontend
    restart: unless-stopped
    networks:
      - edge
    volumes:
      - langkahpublishing_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Wajib diset (mis. lewat file .env di server, JANGAN commit ke git):
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  edge:
    external: true

volumes:
  langkahpublishing_data:
